[project]
name = "github"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tj-cli"]

[dependency-groups]
dev = ["mypy>=2.4.1", "playwright==1.64.1", "pytest>=9.1.1", "ruff>=0.17.4", "pytest-socket>=0.7.0"]

[tool.uv]
package = false

[tool.uv.sources]
tj-cli = { git = "https://github.com/tj-agents/cli.git", rev = "27990ee65900ef3f8a8d33685a3de11ce2742d45", subdirectory = "packages/tj-cli" }

[tool.ruff]
include = [".agents/**/*.py"]

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.ruff.lint.per-file-ignores]
".agents/tests/test_github_configuration.py" = ["ANN401"]
".agents/tests/test_github_collaboration.py" = ["ANN401", "PT011"]
".agents/tests/conftest.py" = ["TID251"]
".agents/tests/test_credential_commands.py" = ["PT011"]
".agents/sync_generated.py" = ["ANN401"]
".agents/github/utility/configuration/scripts/github_configuration.py" = ["TRY300"]
".agents/github/utility/configuration/scripts/configuration_declaration.py" = ["ANN401"]
".agents/github/utility/configuration/scripts/configuration_app.py" = ["ANN401"]
".agents/github/utility/configuration/scripts/configuration_adopt.py" = ["ANN401"]
".agents/github/utility/collaboration/scripts/github_collaboration.py" = ["ANN401", "UP036"]
".agents/github/runtime/gate/github_gate.py" = ["UP036"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "exhaustive-match"]
mypy_path = [".agents/github/utility/collaboration/scripts", ".agents/github/utility/configuration/scripts", ".agents/github/runtime/gate"]
strict = true
warn_unreachable = true
files = [".agents"]

[tool.pytest]
strict = true
testpaths = [".agents/tests"]
addopts = ["--import-mode=importlib", "-ra", "--disable-socket"]
filterwarnings = ["error"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[[tool.python-standards.exceptions]]
path = ".agents/tests/gate_sandbox.py"
rule = "PY016"
reason = "The native test harness resolves real Git from the launching environment before constructing isolated child environments."

[[tool.python-standards.exceptions]]
path = ".agents/github/utility/collaboration/scripts/github_collaboration.py"
rule = "PY001"
reason = "Existing host integration traversal flattens nested records."

[[tool.python-standards.exceptions]]
path = ".agents/github/utility/configuration/scripts/configuration_adopt.py"
rule = "PY001"
reason = "Existing host integration traversal flattens nested records."

[[tool.python-standards.exceptions]]
path = ".agents/github/utility/configuration/scripts/configuration_app.py"
rule = "PY016"
reason = "Legacy host integration reads process state while resolving native configuration."

[[tool.python-standards.exceptions]]
path = ".agents/github/utility/configuration/scripts/configuration_browser.py"
rule = "PY016"
reason = "Legacy host integration reads process state while resolving native configuration."

[[tool.python-standards.exceptions]]
path = ".agents/github/utility/configuration/scripts/configuration_declaration.py"
rule = "PY001"
reason = "Existing host integration traversal flattens nested records."

[[tool.python-standards.exceptions]]
path = ".agents/github/utility/configuration/scripts/github_configuration.py"
rule = "PY016"
reason = "Legacy host integration reads process state while resolving native configuration."
