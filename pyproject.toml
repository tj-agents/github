[project]
name = "github"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy>=2.4.1", "playwright==1.64.1", "pytest>=9.1.1", "ruff>=0.17.4", "pytest-socket>=0.7.0"]

[tool.uv]
package = false

[tool.ruff]
include = [".agents/**/*.py"]

[tool.ruff.lint]
explicit-preview-rules = true
preview = true
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "BLE", "C4", "SIM", "PTH", "PIE", "RET", "RUF", "PGH004", "ANN401", "G004", "PLW1514", "LOG002", "LOG015", "PLC2701", "ICN001", "TID251", "TRY300", "PT009", "PT011", "PT006", "PLR6301"]

[tool.ruff.lint.per-file-ignores]
".agents/tests/test_github_tools.py" = ["PLR6301", "PT011"]
".agents/tests/test_github_mcp.py" = ["ANN401", "PLR6301", "PT011"]
".agents/tests/test_github_hosts.py" = ["PT011"]
".agents/tests/test_github_configuration.py" = ["ANN401"]
".agents/tests/test_github_collaboration.py" = ["ANN401", "PT011"]
".agents/tests/test_github_claude_registration.py" = ["ANN401"]
".agents/tests/test_github_access.py" = ["ANN401", "PT011"]
".agents/tests/test_access_cli.py" = ["PLR6301"]
".agents/tests/conftest.py" = ["TID251"]
".agents/sync_generated.py" = ["ANN401"]
".agents/github/utility/configuration/scripts/github_configuration.py" = ["TRY300"]
".agents/github/utility/configuration/scripts/configuration_declaration.py" = ["ANN401"]
".agents/github/utility/configuration/scripts/configuration_app.py" = ["ANN401"]
".agents/github/utility/configuration/scripts/configuration_adopt.py" = ["ANN401"]
".agents/github/utility/access/scripts/access_core.py" = ["ANN401", "PLR6301"]
".agents/github/utility/collaboration/scripts/github_collaboration.py" = ["ANN401", "UP036"]
".agents/github/utility/access/scripts/github_access.py" = ["UP036"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "exhaustive-match"]
mypy_path = [".agents/github/utility/collaboration/scripts", ".agents/github/utility/access/scripts", ".agents/github/utility/configuration/scripts"]
strict = true
warn_unreachable = true
files = [".agents"]

[tool.pytest]
strict = true
testpaths = [".agents/tests"]
addopts = ["--import-mode=importlib", "-ra", "--disable-socket"]
filterwarnings = ["error"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase" = { "msg" = "Use plain pytest functions and bare assertions." }
"importlib.util.spec_from_file_location" = { "msg" = "Import the installed public API; do not load another checkout by path." }
"sys.path" = { "msg" = "Install the declared dependency; do not modify the import search path." }

[tool.ruff.lint.flake8-pytest-style]
raises-require-match-for = ["*"]

[[tool.python-standards.exceptions]]
path = ".agents/github/utility/access/scripts/github_access.py"
rule = "PY016"
reason = "Legacy host integration reads process state while resolving native configuration."

